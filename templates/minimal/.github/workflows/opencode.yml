name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    uses: ianloubser/code-monkey/.github/workflows/reusable-opencode.yml@main
    with:
      agent: build
    secrets:
      OPENCODE_GH_PAT: ${{ secrets.OPENCODE_GH_PAT }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
