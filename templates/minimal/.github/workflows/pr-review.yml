name: pr-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Draft PRs get no automated review — only review work that has been
    # marked ready for review (fires on ready_for_review, opened, etc.).
    if: github.event.pull_request.draft == false
    uses: ianloubser/code-monkey/.github/workflows/reusable-opencode.yml@main
    with:
      agent: review
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
