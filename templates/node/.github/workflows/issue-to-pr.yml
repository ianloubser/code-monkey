name: issue-to-pr
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  opencode:
    uses: ianloubser/code-monkey/.github/workflows/reusable-opencode.yml@main
    with:
      agent: build
      timeout_minutes: 30
      prompt: |
        You were triggered by the `build` label on this issue. Read the full
        issue body and all comments, then:
        1. Search the repo for related code.
        2. Create branch `agent/<issue-number>-<kebab-summary>`.
        3. Make the smallest change that solves the issue.
        4. Run the project's lint + tests. Paste output in the PR body.
        5. Open a PR with `Fixes #<issue-number>` and the required sections.
        If the issue is ambiguous or too large, open a **draft** PR with a
        plan instead and stop. The user will reply `/oc go` to continue.
    secrets:
      OPENCODE_GH_PAT: ${{ secrets.OPENCODE_GH_PAT }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
