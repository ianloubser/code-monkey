name: issue-to-pr
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  opencode:
    uses: ianloubser/code-monkey/.github/workflows/reusable-opencode.yml@main
    with:
      agent: build
      timeout_minutes: 30
      prompt: |
        You were triggered by the `build` label on this issue. Read the full
        issue body and all comments, then follow your builder instructions in
        `.opencode/agent/build.md`:
        1. Create branch `agent/<issue-number>-<kebab-summary>` and push it.
        2. Open a **draft** PR immediately, then implement in milestones,
           committing and pushing after each one. This run has a hard
           timeout — any unpushed work is lost, so never hoard commits
           locally.
        3. Run the project's lint + tests. Paste output in the PR body under
           "Test plan".
        4. When complete and green, finalize the PR body (`Fixes #<issue>`,
           summary, test plan, risk/rollback) and run `gh pr ready`. Draft
           PRs are never auto-reviewed, so partial work is safe to push.
        If the issue is ambiguous or too large, leave the draft PR with a
        plan and stop. The user will reply `/oc go` to continue.
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
