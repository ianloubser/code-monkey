name: reusable-opencode
on:
  workflow_call:
    inputs:
      prompt:
        description: "Prompt to pass to opencode (overrides default)"
        type: string
        required: false
        default: ""
      model:
        description: "Single model override. If set, skips the fallback chain."
        type: string
        required: false
        default: ""
      model_chain:
        description: "Comma-separated fallback chain. Tried in order until one succeeds."
        type: string
        required: false
        default: "opencode/big-pickle,opencode/deepseek-v4-flash-free,opencode/nemotron-3-ultra-free,opencode/mimo-v2.5-free"
      agent:
        description: "Agent to use. Falls back to repo default_agent or 'build'."
        type: string
        required: false
        default: ""
      trigger:
        description: "Set to 'issue-build' to use the code-monkey dispatcher (own branch/PR/commit flow via `opencode run`). Empty = legacy `opencode github run` path."
        type: string
        required: false
        default: ""
      mentions:
        description: "Comma-separated trigger phrases (case-insensitive). Empty = use action default."
        type: string
        required: false
        default: ""
      allowed_actors:
        description: "Comma-separated GitHub usernames allowed to trigger. Empty = no allowlist."
        type: string
        required: false
        default: "ianloubser"
      timeout_minutes:
        description: "Job timeout in minutes"
        type: number
        required: false
        default: 20
    secrets:
      # OPENCODE_GH_PAT is optional — only needed for cross-repo actions.
      # The caller's auto-provided GITHUB_TOKEN is available in this called
      # workflow as secrets.GITHUB_TOKEN without being passed (it's a
      # system-reserved name and cannot be declared/passed here).
      OPENCODE_GH_PAT:
        required: false
      OPENCODE_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Actor allowlist
        if: inputs.allowed_actors != ''
        id: allow
        env:
          ACTOR: ${{ github.actor }}
          ALLOW: ${{ inputs.allowed_actors }}
        run: |
          echo "actor=$ACTOR"
          if ! echo ",$ALLOW," | grep -qi ",$ACTOR,"; then
            echo "::error::Actor $ACTOR is not in the allowlist ($ALLOW)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Persist the token so opencode's own git push works. The job's
          # auto-provided GITHUB_TOKEN is used by default; an optional PAT
          # (e.g. for cross-repo work) wins when provided. Both have
          # contents: write via the job permissions below.
          token: ${{ secrets.OPENCODE_GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        # opencode commits/pushes the agent's changes itself; without an
        # identity every commit fails with "Author identity unknown" and the
        # error is posted back as a comment, re-triggering this workflow.
        shell: bash
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Checkout code-monkey sidecar
        uses: actions/checkout@v4
        with:
          repository: ianloubser/code-monkey
          ref: main
          path: .code-monkey
          fetch-depth: 1
          token: ${{ secrets.OPENCODE_GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Merge shared skills and agents
        shell: bash
        run: |
          set -e
          SIDECAR=".code-monkey"
          [ -d "$SIDECAR" ] || { echo "::error::Sidecar checkout missing"; exit 1; }

          mkdir -p .opencode/agent .opencode/skills

          if [ -d "$SIDECAR/.opencode/agent" ]; then
            cp -rn "$SIDECAR/.opencode/agent/." .opencode/agent/ 2>/dev/null || true
          fi
          if [ -d "$SIDECAR/.opencode/skills" ]; then
            cp -rn "$SIDECAR/.opencode/skills/." .opencode/skills/ 2>/dev/null || true
          fi

          echo "Merged from sidecar:"
          echo "  agents:  $(ls .opencode/agent 2>/dev/null | tr '\n' ' ')"
          echo "  skills:  $(ls .opencode/skills 2>/dev/null | tr '\n' ' ')"

      - name: Resolve model chain
        id: models
        env:
          SINGLE: ${{ inputs.model }}
          CHAIN: ${{ inputs.model_chain }}
        shell: bash
        run: |
          if [ -n "$SINGLE" ]; then
            {
              echo "models<<EOF"
              echo "$SINGLE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "models<<EOF"
              echo "$CHAIN" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Install opencode
        shell: bash
        run: |
          if ! command -v opencode >/dev/null 2>&1; then
            curl -fsSL https://opencode.ai/install | bash
            echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
            "$HOME/.opencode/bin/opencode" --version
          else
            opencode --version
          fi

      - name: Build path — dispatch to opencode run
        if: ${{ inputs.trigger == 'issue-build' }}
        id: build_dispatch
        env:
          # GITHUB_TOKEN only on this path — no PAT, no opencode GitHub App.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NUM: ${{ github.event.issue.number }}
          AGENT: ${{ inputs.agent }}
          MODELS: ${{ steps.models.outputs.models }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          : "${NUM:?issue number missing — trigger=issue-build requires an issues event}"
          AGENT="${AGENT:-build}"

          # --- assemble issue context ---
          ISSUE_JSON=$(gh issue view "$NUM" --json title,body,comments)
          TITLE=$(printf '%s' "$ISSUE_JSON" | jq -r '.title')
          BODY=$(printf '%s' "$ISSUE_JSON" | jq -r '.body // ""')
          COMMENTS=$(printf '%s' "$ISSUE_JSON" | jq -r '
            (.comments // [])
            | map("- \(.author.login // "unknown"):\n\(.body)")
            | join("\n\n")')

          # slugify the title into a kebab branch suffix
          slug=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g' | sed 's/^-//;s/-$//')
          slug=${slug:0:40}
          [ -z "$slug" ] && slug="work"
          branch="agent/${NUM}-${slug}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Dispatching issue #$NUM to branch $branch"

          # --- branch + draft PR (resume if a previous run already pushed it) ---
          if git ls-remote --heads origin "$branch" | grep -q "$branch"; then
            echo "Resuming existing branch $branch"
            git fetch --depth=1 origin "$branch"
            git checkout "$branch"
          else
            git checkout -b "$branch"
            # An empty commit lets the draft PR exist immediately, before the
            # agent has produced any real work. The agent fills the branch.
            git commit --allow-empty -m "chore: start work on #${NUM}"
            git push -u origin "$branch"
            gh pr create --draft --title "WIP: ${TITLE}" --body "Fixes #${NUM}" >/dev/null
          fi
          PR_NUM=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          echo "pr=$PR_NUM" >> "$GITHUB_OUTPUT"
          gh issue comment "$NUM" --body "Building on \`$branch\` → PR #$PR_NUM ([run]($RUN_URL))"

          # --- prompt: agent follows .opencode/agent/build.md for the flow ---
          PROMPT="You were triggered by the \`build\` label on issue #${NUM}. Implement it following your builder instructions in \`.opencode/agent/build.md\`.

          The dispatcher has already created and pushed branch \`$branch\` and opened draft PR #$PR_NUM. Do NOT create a branch or open a PR. Implement in milestones, committing and pushing after each one (the run has a hard timeout — unpushed work is lost), run the project's lint + tests, finalize the PR body (Fixes #${NUM}, summary, test plan, risk/rollback), then run \`gh pr ready\` when done and green.

          ISSUE #${NUM}: ${TITLE}

          ${BODY}

          Comments:
          ${COMMENTS}"

          # --- run the builder with the model fallback chain ---
          set +e
          LAST_STATUS=1
          while IFS= read -r MODEL; do
            [ -z "$MODEL" ] && continue
            echo "::group::Trying model: $MODEL"
            opencode run --agent "$AGENT" --model "$MODEL" --auto "$PROMPT"
            STATUS=$?
            echo "::endgroup::"
            LAST_STATUS=$STATUS
            if [ $STATUS -eq 0 ]; then break; fi
            echo "::warning::Model $MODEL failed (exit $STATUS). Trying next."
          done <<< "$MODELS"
          exit $LAST_STATUS

      - name: Build path — finalize comment
        if: ${{ always() && inputs.trigger == 'issue-build' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.build_dispatch.outputs.branch }}
          PR: ${{ steps.build_dispatch.outputs.pr }}
          OUTCOME: ${{ steps.build_dispatch.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$OUTCOME" = "success" ]; then
            gh issue comment "$NUM" --body "Done — see PR #${PR} (\`${BRANCH}\`)."
          else
            gh issue comment "$NUM" --body "Build run failed; see [logs]($RUN_URL). Partial work may be on \`${BRANCH}\` (draft PR #${PR})."
          fi

      - name: Run opencode (fallback chain)
        if: ${{ inputs.trigger == '' }}
        id: chain
        env:
          GITHUB_TOKEN: ${{ secrets.OPENCODE_GH_PAT || secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
          AGENT: ${{ inputs.agent }}
          MENTIONS: ${{ inputs.mentions }}
          USE_GITHUB_TOKEN: "true"
          SHARE: "false"
        shell: bash
        run: |
          set +e
          LAST_STATUS=1
          USED_MODEL=""
          while IFS= read -r MODEL; do
            [ -z "$MODEL" ] && continue
            echo "::group::Trying model: $MODEL"
            MODEL="$MODEL" opencode github run
            STATUS=$?
            echo "::endgroup::"
            LAST_STATUS=$STATUS
            USED_MODEL="$MODEL"
            if [ $STATUS -eq 0 ]; then
              {
                echo "used_model=$USED_MODEL"
                echo "all_ok=true"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Model $MODEL failed (exit $STATUS). Trying next."
          done <<< "${{ steps.models.outputs.models }}"
          {
            echo "used_model=${USED_MODEL:-none}"
            echo "all_ok=false"
          } >> "$GITHUB_OUTPUT"
          echo "::error::All models in chain failed. Last exit: $LAST_STATUS"
          exit $LAST_STATUS
