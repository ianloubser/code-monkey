name: pr-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Draft PRs get no automated review — only review work that has been
    # marked ready for review (fires on ready_for_review, opened, etc.).
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/reusable-opencode.yml
    with:
      agent: review
      timeout_minutes: 10
      prompt: |
        Review this pull request. Follow the reviewer's instructions in
        `.opencode/agent/review.md`. Be terse, reference file:line for every
        concern, and end with LGTM / Request changes / Needs discussion.
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
