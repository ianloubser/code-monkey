name: pr-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    uses: ./.github/workflows/reusable-opencode.yml
    with:
      agent: review
      timeout_minutes: 10
      prompt: |
        Review this pull request. Follow the reviewer's instructions in
        `.opencode/agent/review.md`. Be terse, reference file:line for every
        concern, and end with LGTM / Request changes / Needs discussion.
    secrets:
      OPENCODE_GH_PAT: ${{ secrets.OPENCODE_GH_PAT }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
