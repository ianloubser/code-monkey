name: onboard-repo
on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "New repo name (lowercase, no spaces)"
        type: string
        required: true
      description:
        description: "Short repo description"
        type: string
        required: false
        default: ""
      private:
        description: "Make repo private? (Public recommended for free runner minutes)"
        type: boolean
        required: false
        default: false
      template:
        description: "Template to scaffold into the new repo"
        type: choice
        options:
          - minimal
          - node
          - python
        default: minimal
      add_topics:
        description: "Comma-separated GitHub topics to add"
        type: string
        required: false
        default: "code-monkey,opencode"

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate inputs
        run: |
          NAME="${{ inputs.repo_name }}"
          if ! echo "$NAME" | grep -qE '^[a-z0-9._-]+$'; then
            echo "::error::repo_name must be lowercase, no spaces."
            exit 1
          fi

      - name: Checkout code-monkey
        uses: actions/checkout@v4
        with:
          path: code-monkey
          fetch-depth: 1

      - name: Create repo
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_GH_PAT }}
          NAME: ${{ inputs.repo_name }}
          DESC: ${{ inputs.description }}
          PRIVATE: ${{ inputs.private }}
        run: |
          VIS="--public"
          if [ "$PRIVATE" = "true" ]; then VIS="--private"; fi
          if gh repo view "$NAME" >/dev/null 2>&1; then
            echo "::error::Repo $NAME already exists."
            exit 1
          fi
          gh repo create "$NAME" $VIS --description "$DESC" --add-readme

      - name: Clone new repo
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_GH_PAT }}
          NAME: ${{ inputs.repo_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${NAME}.git" new-repo
          cd new-repo
          git config user.name "code-monkey"
          git config user.email "code-monkey@users.noreply.github.com"

      - name: Scaffold template
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          cd new-repo
          cp -r ../code-monkey/templates/$TEMPLATE/. .
          cp ../code-monkey/AGENTS.md .
          git add -A
          git commit -m "chore: scaffold from code-monkey (template: $TEMPLATE)"
          git push origin main

      - name: Add topics
        if: inputs.add_topics != ''
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_GH_PAT }}
          NAME: ${{ inputs.repo_name }}
          TOPICS: ${{ inputs.add_topics }}
        run: |
          gh repo edit "$NAME" --add-topic "$(echo $TOPICS | tr ',' '\n' | head -1)" || true
          for t in $(echo $TOPICS | tr ',' '\n'); do
            gh repo edit "$NAME" --add-topic "$t" || true
          done

      - name: Mirror secrets
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_GH_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NAME: ${{ inputs.repo_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Only the model API key is mirrored — maintenance workflows
          # (issue-to-pr, pr-review, /oc) run on the repo's own GITHUB_TOKEN.
          gh secret set OPENCODE_API_KEY --repo "$OWNER/$NAME" --body "$OPENCODE_API_KEY"
          echo "Secrets copied to $OWNER/$NAME"

      - name: Open welcome issue
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_GH_PAT }}
          NAME: ${{ inputs.repo_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cat > /tmp/welcome.md <<'EOF'
          Welcome to your new repo, scaffolded by **code-monkey**.

          ## What you have
          - `.github/workflows/` — issue-to-pr, pr-review, and `/oc` comment triggers
          - `AGENTS.md` — house rules opencode follows
          - `opencode.json` — model + MCP defaults (free Zen models)

          ## Required repo setting (one-time)
          Settings → Actions → General → Workflow permissions → enable
          **"Allow GitHub Actions to create and approve pull requests"**.
          Without it, the `build` flow can't open draft PRs or mark them ready.

          ## Quick start
          1. Open an issue describing a feature or fix.
          2. Add the `build` label.
          3. The dispatcher pushes a branch and opens a **draft PR**, then the
             builder implements in milestones (committing + pushing after each)
             and marks the PR ready when green.
          4. Or comment `/oc <instruction>` on any issue/PR for ad-hoc work.

          Reply `/oc review` on a PR to test the reviewer.
          EOF
          gh issue create --repo "$OWNER/$NAME" \
            --title "Welcome to $NAME" \
            --body-file /tmp/welcome.md \
            --label "build"

      - name: Summary
        run: |
          echo "Onboarded: https://github.com/${{ github.repository_owner }}/${{ inputs.repo_name }}"
