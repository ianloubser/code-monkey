name: issue-to-pr
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  opencode:
    # Only the `build` label triggers implementation. The prompt + flow live
    # in the reusable workflow (shipped from code-monkey@main), so updates land
    # automatically — no per-repo edits needed.
    if: github.event.label.name == 'build'
    uses: ./.github/workflows/reusable-opencode.yml
    with:
      agent: build
      trigger: issue-build
      timeout_minutes: 30
      allowed_actors: ianloubser
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
