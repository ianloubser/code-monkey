name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  opencode:
    uses: ./.github/workflows/reusable-opencode.yml
    with:
      agent: build
    secrets:
      OPENCODE_GH_PAT: ${{ secrets.OPENCODE_GH_PAT }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
